# Weekly Master Metrics Report
# Buzz YAML-as-code Workflow. Raven's weekly synthesis: current Pe and CVI,
# trends, Resilience Delta (Sr), per-domain breakdown, and the next three priorities.

name: weekly-pe-cvi-report
version: "0.1.0"
description: "Raven's weekly Pe/CVI synthesis and priority recommendations."
owner: raven
channel: "#raven-command"

trigger:
  schedule: "weekly"       # e.g. every Monday 08:00 local
  manual: true

steps:
  - id: gather-domain-indices
    action: collect_events
    kind: 30102            # all domain index events from the past week
    window: "7d"

  - id: compute-pe
    action: calculate
    uses: math/pe_calculator.py
    emits:
      kind: 30100
    output: [pe, pe_normalized, breakdown]

  - id: compute-cvi
    action: calculate
    uses: math/cvi_calculator.py
    emits:
      kind: 30101
    output: [cvi, cvi_status]

  - id: compute-resilience-delta
    action: calculate
    uses: math/sr_calculator.py
    inputs:
      positive_shocks: from_kind_30105_positive_7d
      negative_shocks: from_kind_30105_negative_7d
    output: [sr, trajectory]

  - id: trend-analysis
    action: analyze_trend
    metrics: [pe, cvi]
    window: "8w"           # 8-week trend
    output: [pe_trend, cvi_trend]

  - id: identify-priorities
    action: rank_leverage
    from: "${gather-domain-indices.breakdown}"
    top: 3
    description: "Rank domains by return-on-effort; surface cross-realm couplings."
    output: [top_three_priorities]

  - id: publish-report
    action: post
    channel: "#raven-command"
    template: |
      🐦‍⬛ **Weekly Sovereignty Report**
      • Peace Efficiency Index (Pe): ${pe}  (normalized ${pe_normalized})  ${pe_trend}
      • Community Vitality Index (CVI): ${cvi}  (${cvi_status})  ${cvi_trend}
      • Resilience Delta (Sr): ${sr}  →  trajectory: ${trajectory}

      **Per-domain breakdown:** ${breakdown}

      **Your three highest-leverage priorities this week:**
      1. ${top_three_priorities[0]}
      2. ${top_three_priorities[1]}
      3. ${top_three_priorities[2]}

  - id: schedule-coherence-shock
    action: maybe_trigger
    when: "sr <= 0"        # if resilience is flat/negative, schedule a positive shock
    triggers:
      - workflow: coherence-shock-event

on_complete:
  notify: "#raven-command"
  message: "Weekly report published. Pe=${pe} · CVI=${cvi} · Sr=${sr}."
